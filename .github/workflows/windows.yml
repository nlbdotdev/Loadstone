name: Windows checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm notices
      - run: git diff --exit-code -- notices
      - run: git diff --check
      - name: Build Steam depot preview
        run: pnpm package:steam
      - name: Verify staged executable
        shell: pwsh
        run: |
          $kit = Get-ChildItem -LiteralPath release/steam -Directory | Select-Object -First 1
          node scripts/steam-depot.mjs --verify $kit.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOADSTONE_TEST_EXE = Join-Path $kit.FullName 'content/Loadstone.exe'
          node --test tests/electron.test.mjs tests/live.test.mjs tests/nexus.test.mjs tests/onboarding.test.mjs tests/close-guard.test.mjs tests/native-preview.test.mjs
